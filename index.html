    function safeRemoveWhiteBackground(pImg) {
      if (!pImg || pImg.width <= 0) return;
      try {
        pImg.loadPixels();
        let w = pImg.width;
        let h = pImg.height;
        let visited = new Uint8Array(w * h);
        let queue = [];

        function checkAndPush(x, y) {
          if (x < 0 || x >= w || y < 0 || y >= h) return;
          let idx = y * w + x;
          if (visited[idx]) return;
          let pIdx = idx * 4;
          let r = pImg.pixels[pIdx];
          let g = pImg.pixels[pIdx + 1];
          let b = pImg.pixels[pIdx + 2];
          let a = pImg.pixels[pIdx + 3];

          if (a > 0 && r > 220 && g > 220 && b > 220) {
            visited[idx] = 1;
            queue.push(x, y);
          }
        }

        for (let x = 0; x < w; x++) { checkAndPush(x, 0); checkAndPush(x, h - 1); }
        for (let y = 0; y < h; y++) { checkAndPush(0, y); checkAndPush(w - 1, y); }

        let qHead = 0;
        while (qHead < queue.length) {
          let qx = queue[qHead++];
          let qy = queue[qHead++];
          let pIdx = (qy * w + qx) * 4;
          pImg.pixels[pIdx + 3] = 0;
          checkAndPush(qx + 1, qy); checkAndPush(qx - 1, qy);
          checkAndPush(qx, qy + 1); checkAndPush(qx, qy - 1);
        }
        pImg.updatePixels();
      } catch (e) {
        console.warn("去背略過：", e);
      }
    }

    function safePlayAudio(audioElem) {
      if (!audioElem || !isMusicPlaying) return;
      try {
        let p = audioElem.play();
        if (p && typeof p.catch === 'function') p.catch(function() {});
      } catch (err) {}
    }

    function playLampSound() {
      if (!isMusicPlaying || !lampElement) return;
      try {
        lampElement.currentTime = 0;
        lampElement.volume = 0.6;
        lampElement.play().catch(function() {});
      } catch (e) {}
    }

    function triggerWeakAudio(durationSec = 2.0) {
      if (!isMusicPlaying || !weakElement) return;
      if (millis() < weakStopTimer) return;
      try {
        weakElement.currentTime = 0;
        weakElement.volume = 0.7;
        weakElement.play().catch(function() {});
        isWeakPlaying = true;
        weakStopTimer = millis() + durationSec * 1000;
      } catch (e) {}
    }

    function playHappySound() {
      if (!isMusicPlaying || !happyElement) return;
      try {
        happyElement.currentTime = 0;
        happyElement.volume = 0.8;
        happyElement.play().catch(function() {});
      } catch (e) {}
    }

    function preload() {
      dogImg = loadImage('dog.png', () => { dogLoaded = true; }, () => { dogLoaded = false; });
      dogCleanImg = loadImage('dog_clean.png', () => { dogCleanLoaded = true; }, () => { dogCleanLoaded = false; });
      dogClean2Img = loadImage('dog_clean2.png', () => { dogClean2Loaded = true; }, () => { dogClean2Loaded = false; });
      menuBgImg = loadImage('menu_bg.png', () => { menuBgLoaded = true; }, () => { menuBgLoaded = false; });

      dirtyDog1Img = loadImage('dirtydog1.png', (img) => {
        safeRemoveWhiteBackground(img);
        dirtyDog1Loaded = true;
      }, () => { dirtyDog1Loaded = false; });

      dirtyDog2Img = loadImage('dirtydog2.png', () => { dirtyDog2Loaded = true; }, () => { dirtyDog2Loaded = false; });
      dirtyDog3Img = loadImage('dirtydog3.png', () => { dirtyDog3Loaded = true; }, () => { dirtyDog3Loaded = false; });

      for (let i = 1; i <= 6; i++) {
        hatImgs.push(loadImage(`hat/${i}.png`, () => {}, () => {}));
        skinImgs.push(loadImage(`skin/${i}.png`, () => {}, () => {}));
        shoeImgs.push(loadImage(`shoe/${i}.png`, () => {}, () => {}));
      }
    }

    function setup() {
      createCanvas(windowWidth, windowHeight);
      textFont("sans-serif");
      textAlign(CENTER, CENTER);
      imageMode(CENTER);
      updateScale();

      for (let i = 0; i < RAIN_COUNT; i++) {
        rainParticles.push({
          x: random(-200, V_WIDTH + 200),
          y: random(-300, V_HEIGHT),
          len: random(20, 42),
          speed: random(18, 28)
        });
      }

      bgmElement = document.getElementById("bgmAudio");
      rainElement = document.getElementById("rainAudio");
      weakElement = document.getElementById("weakAudio");
      happyElement = document.getElementById("happyAudio");
      lampElement = document.getElementById("lampAudio");
      bubbleElement = document.getElementById("bubbleAudio");

      if (bgmElement) {
        bgmElement.volume = bgmTargetVolume;
        safePlayAudio(bgmElement);
      }
      if (rainElement) rainElement.volume = 0;
      if (bubbleElement) bubbleElement.volume = 0;

      resetBranchPosition();
      resetBathSystem();

      function unlockAudioContext() {
        if (!audioUnlocked) {
          audioUnlocked = true;
          if (isMusicPlaying) {
            if (currentScene === 'STORY' && rainElement) safePlayAudio(rainElement);
            else if (currentScene === 'BATH_PLAYING' && bubbleElement) safePlayAudio(bubbleElement);
            else if (bgmElement) safePlayAudio(bgmElement);
          }
        }
        window.removeEventListener("pointerdown", unlockAudioContext);
        window.removeEventListener("touchstart", unlockAudioContext);
        window.removeEventListener("click", unlockAudioContext);
      }
      window.addEventListener("pointerdown", unlockAudioContext);
      window.addEventListener("touchstart", unlockAudioContext);
      window.addEventListener("click", unlockAudioContext);
    }

    function resetBranchPosition() {
      branchData.x = branchData.initialX;
      branchData.y = branchData.initialY;
      branchData.isDragging = false;
      branchData.isRemoved = false;
    }

    function resetCareSystem() {
      for (let t of careTools) t.done = false;
      selectedToolIndex = 0;
      careSuccess = false;
      painEffectTimer = 0;
      painTears = [];
      cottonWipes = 0;
      isInjecting = false;
      injectProgress = 0;
      bandageRollProgress = 0;
      draggedBugIndex = -1;
      bugs = [
        { x: -50, y: -20, vx: 0.35, vy: 0.2, caught: false, inJar: false },
        { x: -10, y: 25, vx: -0.28, vy: 0.3, caught: false, inJar: false },
        { x: -80, y: 15, vx: 0.3, vy: -0.25, caught: false, inJar: false }
      ];
    }

    function resetBathSystem() {
      isColorConfirmed = false;
      selectedTubColor = TUB_COLORS[0];
      let curW = width > 0 ? width : V_WIDTH;
      let curH = height > 0 ? height : V_HEIGHT;
      bathDogState = {
        inTub: false,
        isDragging: false,
        x: curW * 0.76,
        y: curH * 0.60,
        stage: 1,
        headBubbles: 0,
        bodyBubbles: 0,
        washProgress: 0,
        dryProgress: 0
      };
      bathCurrentStep = 1;
      bathSuccess = false;
      isShampooDragging = false;
      isShowerActive = false;
      isDryerActive = false;
    }

    function resetDressSystem() {
      wardrobeOpen = false;
      dressPhase = 1;
      selectedHatIndex = 0;
      selectedSkinIndex = -1;
      selectedShoeIndex = -1;
      confirmedHat = -1;
      confirmedSkin = -1;
      confirmedShoe = -1;
      dressGameOver = false;
    }

    function triggerConfetti(durationSec = 1.0) {
      confettiTimer = millis() + durationSec * 1000;
      confettiParticles = [];
      for (let i = 0; i < 110; i++) {
        confettiParticles.push({
          x: random(width),
          y: random(-50, height * 0.4),
          vx: random(-3.5, 3.5),
          vy: random(4, 9),
          size: random(7, 14),
          color: random(['#F43F5E', '#FB923C', '#FBBF24', '#34D399', '#38BDF8', '#A855F7', '#FFFFFF']),
          angle: random(TWO_PI),
          spin: random(-0.15, 0.15)
        });
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      updateScale();
    }

    function updateScale() {
      let scaleX = width / V_WIDTH;
      let scaleY = height / V_HEIGHT;
      canvasScale = min(scaleX, scaleY);
      if (canvasScale <= 0 || isNaN(canvasScale)) canvasScale = 1;
      offsetX = (width - V_WIDTH * canvasScale) / 2;
      offsetY = (height - V_HEIGHT * canvasScale) / 2;
    }

    function getVirtualMouse() {
      let s = (canvasScale > 0) ? canvasScale : 1;
      return {
        x: (mouseX - offsetX) / s,
        y: (mouseY - offsetY) / s
      };
    }

    function draw() {
      if (!isHomeTimeInitialized) {
        homeStartTime = millis();
        isHomeTimeInitialized = true;
      }

      drawDynamicFullWindowBackground();

      cloudAngle = sin(frameCount * 0.06) * 0.15;
      buttonPulse = sin(frameCount * 0.08) * 3;

      updateAudioCrossfade();

      if (isWeakPlaying && millis() >= weakStopTimer) {
        if (weakElement) {
          try {
            weakElement.pause();
            weakElement.currentTime = 0;
          } catch (e) {}
        }
        isWeakPlaying = false;
      }

      if (currentScene === 'STORY') {
        drawFullscreenStormSkyAndGround();
      }

      if (currentScene === 'STAGE_SELECT') {
        drawStageSelectScene();
      } else if (currentScene === 'BATH_PLAYING') {
        drawFullscreenBathScene();
      } else if (currentScene === 'DRESS_PLAYING') {
        drawFullscreenDressScene();
      } else {
        push();
        translate(offsetX, offsetY);
        scale(canvasScale);

        if (currentScene === 'COVER') {
          drawCoverScene();
        } else if (currentScene === 'LOADING_STORY') {
          drawLoadingStoryScene();
        } else if (currentScene === 'STORY') {
          drawStoryScene();
        } else if (currentScene === 'LOADING_NEXT') {
          drawLoadingNextScene();
        } else if (currentScene === 'CARE_PLAYING') {
          drawCarePlayingScene();
        } else if (currentScene === 'LOADING_BATH') {
          drawLoadingBathScene();
        } else if (currentScene === 'LOADING_DRESS') {
          drawLoadingDressScene();
        }

        pop();
      }

      if (currentScene === 'STORY') {
        drawFullscreenRainLayer();
      }

      if (millis() < confettiTimer) {
        drawFullscreenConfetti();
      }

      drawFullscreenButtonDirect();
      drawMusicButtonDirect();
    }

    function drawDynamicFullWindowBackground() {
      push();
      resetMatrix();
      noStroke();
      let steps = 14;

      if (currentScene === 'STORY') {
        for (let i = 0; i <= steps; i++) {
          let inter = i / steps;
          let c = lerpColor(color(PALETTE.stormSkyTop), color(PALETTE.stormSkyBottom), inter);
          fill(c);
          rect(0, (height / steps) * i, width, height / steps + 2);
        }
      } else if (currentScene === 'STAGE_SELECT') {
        fill('#86EFAC');
        rect(0, 0, width, height);
      } else if (currentScene === 'BATH_PLAYING') {
        for (let i = 0; i <= steps; i++) {
          let inter = i / steps;
          let c = lerpColor(color('#E0F2FE'), color('#BAE6FD'), inter);
          fill(c);
          rect(0, (height / steps) * i, width, height / steps + 2);
        }
      } else if (currentScene === 'DRESS_PLAYING') {
        for (let i = 0; i <= steps; i++) {
          let inter = i / steps;
          let c = lerpColor(color('#FFF1F2'), color('#FFE4E6'), inter);
          fill(c);
          rect(0, (height / steps) * i, width, height / steps + 2);
        }
      } else {
        for (let i = 0; i <= steps; i++) {
          let inter = i / steps;
          let c = lerpColor(color(PALETTE.bgPinkTop), color(PALETTE.bgPinkBottom), inter);
          fill(c);
          rect(0, (height / steps) * i, width, height / steps + 2);
        }
      }
      pop();
    }

    function drawFullscreenStormSkyAndGround() {
      push();
      resetMatrix();
      noStroke();

      let groundScreenY = offsetY + 360 * canvasScale;
      fill(PALETTE.streetFloor);
      rect(0, groundScreenY, width, height - groundScreenY + 2);

      let windSway = sin(frameCount * 0.12) * (20 * canvasScale);
      fill(15, 23, 42, 220);
      beginShape();
      vertex(0, groundScreenY);
      bezierVertex(width * 0.15, groundScreenY - 20 * canvasScale + windSway, width * 0.25, groundScreenY - 90 * canvasScale + windSway, width * 0.35, groundScreenY);
      bezierVertex(width * 0.55, groundScreenY - 50 * canvasScale + windSway, width * 0.7, groundScreenY - 100 * canvasScale + windSway, width * 0.85, groundScreenY);
      vertex(width, groundScreenY);
      vertex(width, height);
      vertex(0, height);
      endShape(CLOSE);
      pop();
    }

    function drawFullscreenRainLayer() {
      push();
      resetMatrix();
      stroke(PALETTE.rainStreak);
      strokeWeight(2.0);

      let angle = PI * 0.35;
      let cosA = cos(angle);
      let sinA = sin(angle);

      for (let i = 0; i < rainParticles.length; i++) {
        let r = rainParticles[i];
        let dx = cosA * r.len * canvasScale;
        let dy = sinA * r.len * canvasScale;

        let screenX = offsetX + r.x * canvasScale;
        let screenY = offsetY + r.y * canvasScale;

        line(screenX, screenY, screenX + dx, screenY + dy);

        r.x += cosA * r.speed;
        r.y += sinA * r.speed;

        if (r.y > V_HEIGHT + 80 || r.x > V_WIDTH + 260) {
          r.x = random(-240, V_WIDTH);
          r.y = random(-120, -10);
        }
      }
      pop();
    }

    function drawFullscreenConfetti() {
      push();
      resetMatrix();
      noStroke();
      for (let p of confettiParticles) {
        fill(p.color);
        push();
        translate(p.x, p.y);
        rotate(p.angle);
        rectMode(CENTER);
        rect(0, 0, p.size, p.size * 0.5, 2);
        pop();
        p.y += p.vy;
        p.x += p.vx;
        p.angle += p.spin;
      }
      pop();
    }

    function updateAudioCrossfade() {
      if (!isMusicPlaying) {
        try {
          if (bgmElement) bgmElement.volume = 0;
          if (rainElement) rainElement.volume = 0;
          if (bubbleElement) bubbleElement.volume = 0;
          if (weakElement) weakElement.volume = 0;
        } catch (e) {}
        return;
      }

      try {
        if (bgmElement && !isNaN(bgmElement.volume)) {
          let curr = bgmElement.volume;
          let next = lerp(curr, bgmTargetVolume, 0.08);
          if (abs(next - bgmTargetVolume) < 0.005) next = bgmTargetVolume;
          bgmElement.volume = constrain(next, 0, 1);
          if (bgmTargetVolume === 0 && bgmElement.volume <= 0.01 && !bgmElement.paused) {
            bgmElement.pause();
          }
        }
        if (rainElement && !isNaN(rainElement.volume)) {
          let curr = rainElement.volume;
          let next = lerp(curr, rainTargetVolume, 0.08);
          if (abs(next - rainTargetVolume) < 0.005) next = rainTargetVolume;
          rainElement.volume = constrain(next, 0, 1);
          if (rainTargetVolume === 0 && rainElement.volume <= 0.01 && !rainElement.paused) {
            rainElement.pause();
          }
        }

        if (bubbleElement) {
          if (currentScene === 'BATH_PLAYING') {
            if (bubbleElement.paused) safePlayAudio(bubbleElement);
            bubbleElement.volume = lerp(bubbleElement.volume, 0.65, 0.1);
          } else {
            bubbleElement.volume = lerp(bubbleElement.volume, 0, 0.1);
            if (bubbleElement.volume <= 0.02 && !bubbleElement.paused) {
              bubbleElement.pause();
            }
          }
        }
      } catch (e) {}
    }

    function drawLoopingDogSystem(x, y) {
      let totalElapsed = (millis() - homeStartTime) / 1000;
      let cycleTime = totalElapsed % HOME_CYCLE_DURATION;

      if (cycleTime >= 5.0 && cycleTime < 5.3 && lastSmokeStage !== 1) {
        lastSmokeStage = 1;
        spawnDelicateSmoke(x, y + 10);
      } else if (cycleTime >= 9.0 && cycleTime < 9.3 && lastSmokeStage !== 2) {
        lastSmokeStage = 2;
        spawnDelicateSmoke(x, y + 10);
      } else if (cycleTime >= 12.3 && cycleTime < 12.6 && lastSmokeStage !== 3) {
        lastSmokeStage = 3;
        spawnDelicateSmoke(x, y + 10);
      } else if (cycleTime < 4.5 && lastSmokeStage === 3) {
        lastSmokeStage = 0;
      }

      push();
      translate(x, y);

      let breath = sin(frameCount * 0.045);
      noStroke();
      fill(0, 0, 0, 35);
      ellipse(0, 85, 300 + breath * 12, 50);

      if (cycleTime < 5.6) {
        drawInjuredDogSprite(false);
      } else if (cycleTime >= 5.6 && cycleTime < 9.6) {
        drawCleanDogSprite(dogCleanImg, dogCleanLoaded, CLEAN_DOG_BASE_HEIGHT);
      } else {
        drawCleanDogSprite(dogClean2Img, dogClean2Loaded, CLEAN_DOG_BASE_HEIGHT);
      }

      pop();

      updateAndDrawDelicateSmoke();

      if (cycleTime >= 9.8 && cycleTime < 12.2) {
        updateAndDrawSparkles(x, y);
      }
    }

    function spawnDelicateSmoke(cx, cy) {
      for (let i = 0; i < 45; i++) {
        smokePuffs.push({
          x: cx + random(-85, 85),
          y: cy + random(-25, 55),
          vx: random(-1.5, 1.5),
          vy: random(-1.9, -0.5),
          size: random(18, 34),
          maxSize: random(50, 80),
          alpha: 250,
          growRate: random(1.5, 2.2),
          fadeRate: random(2.6, 3.8),
          shade: random([255, 248, 242])
        });
      }
    }

    function updateAndDrawDelicateSmoke() {
      for (let i = smokePuffs.length - 1; i >= 0; i--) {
        let p = smokePuffs[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.size < p.maxSize) p.size += p.growRate;
        p.alpha -= p.fadeRate;

        noStroke();
        fill(254, 218, 232, p.alpha * 0.45);
        circle(p.x, p.y, p.size * 1.25);
        fill(p.shade, p.shade, p.shade, p.alpha);
        circle(p.x, p.y, p.size);

        if (p.alpha <= 0) smokePuffs.splice(i, 1);
      }
    }

    function updateAndDrawSparkles(cx, cy) {
      if (frameCount % 6 === 0) {
        sparkles.push({
          x: cx + random(-140, 140),
          y: cy + random(-80, 40),
          size: random(9, 18),
          life: 255,
          rot: random(TWO_PI),
          rotSpeed: random(-0.08, 0.08)
        });
      }

      for (let i = sparkles.length - 1; i >= 0; i--) {
        let s = sparkles[i];
        s.life -= 6;
        s.y -= 0.6;
        s.rot += s.rotSpeed;

        push();
        translate(s.x, s.y);
        rotate(s.rot);
        noStroke();
        fill(253, 224, 71, s.life);
        beginShape();
        vertex(0, -s.size);
        vertex(s.size * 0.25, -s.size * 0.25);
        vertex(s.size, 0);
        vertex(s.size * 0.25, s.size * 0.25);
        vertex(0, s.size);
        vertex(-s.size * 0.25, s.size * 0.25);
        vertex(-s.size, 0);
        vertex(-s.size * 0.25, -s.size * 0.25);
        endShape(CLOSE);
        pop();

        if (s.life <= 0) sparkles.splice(i, 1);
      }
    }

        circle(leftEyeX - 26, leftEyeY + 22, 7);
        circle(rightEyeX + 18, rightEyeY + 12, 10);
        circle(rightEyeX + 26, rightEyeY + 22, 7);
      } else {
        let blinkTimer = frameCount % 190;
        let isBlinking = blinkTimer > 165 && blinkTimer < 180;

        if (isBlinking) {
          if (currentScene === 'CARE_PLAYING') {
            triggerWeakAudio(2.0);

      let elapsed = (millis() - loadingStartTime) / 1000;
      let progress = constrain(map(elapsed, 0, LOADING_DURATION, 0, 100), 0, 100);

      if (progress >= 90) {
        let fadeFactor = map(progress, 90, 100, 0, 1);
        bgmTargetVolume = 0.5 * (1 - fadeFactor);
        rainTargetVolume = 0.65 * fadeFactor;
        if (rainElement && rainElement.paused && isMusicPlaying) safePlayAudio(rainElement);

      drawGenericProgressBar("正在前往冒險旅程...", progress);

      if (elapsed >= LOADING_DURATION) {

        storyStartTime = millis();
        resetBranchPosition();
        if (bgmElement) bgmElement.pause();
      }

    function drawStoryScene() {
      let storyElapsed = (millis() - storyStartTime) / 1000;
      let vm = getVirtualMouse();

      let walkBobY = (storyElapsed < 5.0) ? sin(frameCount * 0.18) * 11 : sin(frameCount * 0.04) * 2;
      let walkSwayX = (storyElapsed < 5.0) ? cos(frameCount * 0.09) * 5 : 0;

      push();
      translate(walkSwayX, walkBobY);

      drawTyphoonCenterElements();

      if (storyElapsed >= 5.0) {
        let dogFadeAlpha = map(storyElapsed, 5.0, 5.8, 0, 255, true);
        push();
        tint(255, dogFadeAlpha);

        fill(15, 23, 42, 130);
        noStroke();
        ellipse(V_WIDTH / 2, 470, 320, 55);

        let dogBaseX = V_WIDTH / 2;
        let dogBaseY = 405;

        translate(dogBaseX, dogBaseY);
        drawInjuredDogSprite(true);

        if (branchData.isDragging) {
          branchData.x = vm.x - dogBaseX - branchData.dragOffsetX;
          branchData.y = vm.y - dogBaseY - branchData.dragOffsetY;
          if (branchData.y > 55 || abs(branchData.x) > 110) branchData.isRemoved = true;
        }

        let branchWorldX = dogBaseX + branchData.x;
        let branchWorldY = dogBaseY + branchData.y;
        let isBranchHover = dist(vm.x, vm.y, branchWorldX, branchWorldY) < 55;

        drawDraggableBranch(isBranchHover);

        pop();
        noTint();
      }

      pop();

      if (storyElapsed >= 10.0) {
        let bubbleAlpha = map(storyElapsed, 10.0, 10.5, 0, 255, true);
        let bubbleY = map(storyElapsed, 10.0, 10.5, 130, 110, true);
        let tipDialogue = branchData.isRemoved 
          ? "太好了！樹枝移開了，我們來幫助牠吧" 
          : "狗狗看起來受傷了，幫牠把樹枝移開到地面吧！";
        drawStoryDialogueBox(V_WIDTH / 2, bubbleY, tipDialogue, bubbleAlpha);

      if (storyElapsed >= 10.0 && branchData.isRemoved) {
        let isNextHover = vm.x > 605 && vm.x < 745 && vm.y > 480 && vm.y < 540;
        drawNextJellyButton(675, 510, 135, 52, "NEXT ➜", isNextHover);
      } else if (storyElapsed >= 10.0 && !branchData.isRemoved) {
        push();
        fill(253, 224, 71, 230);
        textSize(15);
        textStyle(BOLD);
        text("👇 請拖曳樹枝至地面", V_WIDTH / 2 + 10, 300);
        pop();
      }

      fill(255, 180);
      textSize(14);
      text("今日是颱風天...", V_WIDTH / 2, 38);

    function drawCreepingBugs() {
      for (let i = 0; i < bugs.length; i++) {
        let b = bugs[i];
        if (b.inJar) continue;

        if (!b.caught) {
          b.x += b.vx;
          b.y += b.vy;
          if (b.x < -90 || b.x > -10) b.vx *= -1;
          if (b.y < -35 || b.y > 35) b.vy *= -1;
        }

        push();
        translate(b.x, b.y);

        noStroke();
        fill(24, 18, 12);
        ellipse(0, 0, 10, 8);
        stroke(24, 18, 12);
        strokeWeight(1.3);

        let legWiggle = sin(frameCount * 0.4 + i) * 2.5;
        line(-4, -3, -8 + legWiggle, -7);
        line(0, -3, 0, -8);
        line(4, -3, 8 - legWiggle, -7);
        line(-4, 3, -8 - legWiggle, 7);
        line(0, 3, 0, 8);
        line(4, 3, 8 + legWiggle, 7);
        pop();
      }
    }

    function updateAndDrawInjectionProcess(neckX, neckY) {
      push();
      let vm = getVirtualMouse();

      if (isInjecting) {
        if (dist(vm.x, vm.y, neckX, neckY) < 65) {
          injectProgress = min(100, injectProgress + INJECT_SPEED);
          painEffectTimer = millis() + 400;

          if (injectProgress >= 100) {
            careTools[1].done = true;
            isInjecting = false;
            checkAllDone();
          }
        } else {
          isInjecting = false;
        }
      }

      if (injectProgress > 0) {
        rectMode(CENTER);
        let barX = neckX;
        let barY = neckY - 60;
        let barW = 120;
        let barH = 18;

        fill(15, 23, 42, 220);
        stroke(56, 189, 248);
        strokeWeight(2);
        rect(barX, barY, barW, barH, 9);

        let fillW = map(injectProgress, 0, 100, 0, barW - 6);
        if (fillW > 0) {
          noStroke();
          fill(56, 189, 248);
          rect(barX - (barW - 6 - fillW) / 2, barY, fillW, barH - 6, 6);
        }

        fill(255);
        noStroke();
        textSize(11);
        textStyle(BOLD);
        text(`注射推藥中 ${floor(injectProgress)}%`, barX, barY - 16);

        push();
        translate(neckX, neckY);

        stroke(200);

        line(0, 0, 0, 20);

        fill(255, 255, 255, 220);
        stroke(100, 116, 139);
        strokeWeight(2);
        rect(0, -22, 16, 44, 4);

        let liquidH = map(injectProgress, 0, 100, 36, 0);
        if (liquidH > 0) {
          fill(56, 189, 248, 200);
          noStroke();
          rect(0, -4 + liquidH / 2 - 36, 12, liquidH, 2);
        }

        let pistonY = map(injectProgress, 0, 100, -44, -22);
        stroke(71, 85, 105);
        strokeWeight(3);
        line(0, pistonY - 20, 0, pistonY);
        line(-8, pistonY - 20, 8, pistonY - 20);
        pop();

    function drawInteractiveWardrobe(x, y, s) {

    function drawOpenWardrobeItems(wW, wH, s) {
      push();
      fill('#92400E');
      stroke('#451A03');
      strokeWeight(2 * s);
      rectMode(CORNER);
      let doorW = (wW - 28 * s) / 2;
      let doorH = wH - 46 * s;
      let topY = -wH / 2 + 26 * s;
      rect(-wW / 2 - doorW * 0.45, topY, doorW * 0.5, doorH, 4 * s);
      rect(wW / 2 - 5 * s, topY, doorW * 0.5, doorH, 4 * s);

      let cols = 2;
      let itemW = 105 * s;
      let itemH = 68 * s;
      let startX = -65 * s;
      let startY = -95 * s;

      let currentSelected = -1;
      if (dressPhase === 1) currentSelected = selectedHatIndex;
      else if (dressPhase === 2) currentSelected = selectedSkinIndex;
      else if (dressPhase === 3) currentSelected = selectedShoeIndex;

      for (let i = 0; i < 6; i++) {
        let col = i % cols;
        let row = floor(i / cols);
        let ix = startX + col * (itemW + 18 * s);
        let iy = startY + row * (itemH + 12 * s);

        let worldX = width * 0.70 + ix;
        let worldY = height * 0.52 + iy;
        let isHover = mouseX > worldX - itemW / 2 && mouseX < worldX + itemW / 2 &&
                      mouseY > worldY - itemH / 2 && mouseY < worldY + itemH / 2;
        let isSelected = (currentSelected === i);

        push();
        translate(ix, iy);
        rectMode(CENTER);

        fill(isSelected ? '#FEF9C3' : 255);
        if (isHover || isSelected) {
          stroke('#EAB308');
          strokeWeight(4 * s);
        } else {
          stroke('#CBD5E1');
          strokeWeight(2 * s);
        }
        rect(0, 0, itemW, itemH, 12 * s);

        if (dressPhase === 1) drawHatOptionIcon(i, s);
        else if (dressPhase === 2) drawSkinOptionIcon(i, s);
        else if (dressPhase === 3) drawShoeOptionIcon(i, s);

        pop();
      }
      pop();
    }

      push();

      rectMode(CENTER);
      fill(isHover ? '#7DD3FC' : PALETTE.jellyBlue);

    function toggleMusic() {
      if (isMusicPlaying) {
        try {
          if (bgmElement) bgmElement.pause();
          if (rainElement) rainElement.pause();
          if (bubbleElement) bubbleElement.pause();
          if (weakElement) weakElement.pause();
        } catch (e) {}
        isMusicPlaying = false;
      } else {
        isMusicPlaying = true;
        if (currentScene === 'STORY') {
          if (rainElement) safePlayAudio(rainElement);
        } else if (currentScene === 'BATH_PLAYING') {
          if (bubbleElement) safePlayAudio(bubbleElement);
        } else {
          if (bgmElement) safePlayAudio(bgmElement);
        }
      }
    }

    function toggleFullscreen() {
      try {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          let elem = document.documentElement;
          if (elem.requestFullscreen) elem.requestFullscreen();
          else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
        } else {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
      } catch (e) {}
    }

    // ==========================================
    // 事件處理
    // ==========================================
    function handlePointerDown(px, py) {
      if (dist(mouseX, mouseY, width - 50, 42) < 28) {
        toggleFullscreen();
        return;
      }

      if (dist(mouseX, mouseY, width - 105, 42) < 28) {
        toggleMusic();
        return;
      }

      if (currentScene === 'COVER') {
        if (px > V_WIDTH / 2 - 100 && px < V_WIDTH / 2 + 100 && py > 470 && py < 540) {
          currentScene = 'LOADING_STORY';
          loadingStartTime = millis();
        }
      } else if (currentScene === 'STORY') {
        let storyElapsed = (millis() - storyStartTime) / 1000;

        if (storyElapsed >= 5.0 && !branchData.isRemoved) {
          let dogBaseX = V_WIDTH / 2;
          let dogBaseY = 405;
          let branchWorldX = dogBaseX + branchData.x;
          let branchWorldY = dogBaseY + branchData.y;

          if (dist(px, py, branchWorldX, branchWorldY) < 55) {
            branchData.isDragging = true;
            branchData.dragOffsetX = px - branchWorldX;
            branchData.dragOffsetY = py - branchWorldY;
            return;
          }
        }

        if (storyElapsed >= 10.0 && branchData.isRemoved) {
          if (px > 605 && px < 745 && py > 480 && py < 540) {
            loadingNextStartTime = millis();
            currentScene = 'LOADING_NEXT';
          }
        }
      } else if (currentScene === 'STAGE_SELECT') {
        let scaleFactor = ((menuBgLoaded || (menuBgImg && menuBgImg.width > 0)) && menuBgImg && menuBgImg.width > 0) ? 
                          max(width / menuBgImg.width, height / menuBgImg.height) : 1;
        let imgW = (menuBgImg && menuBgImg.width > 0) ? menuBgImg.width * scaleFactor : width;
        let imgH = (menuBgImg && menuBgImg.height > 0) ? menuBgImg.height * scaleFactor : height;
        let drawX = (width - imgW) / 2;
        let drawY = (height - imgH) / 2;

        let cardY = drawY + imgH * 0.225;
        let cardH = imgH * 0.585;
        let aidX = drawX + imgW * 0.125;
        let aidW = imgW * 0.245;
        let bathX = drawX + imgW * 0.385;
        let bathW = imgW * 0.242;
        let dressX = drawX + imgW * 0.638;
        let dressW = imgW * 0.242;

        if (mouseX > aidX && mouseX < (aidX + aidW) && mouseY > cardY && mouseY < (cardY + cardH)) {
          resetCareSystem();
          currentScene = 'CARE_PLAYING';
        } else if (mouseX > bathX && mouseX < (bathX + bathW) && mouseY > cardY && mouseY < (cardY + cardH)) {
          if (!unlockedStages.bath) {
            lockTipMsg = "🔒 請先幫狗狗完成急救才能洗澡喔！";
            lockTipTimer = millis() + 2200;
          } else {
            loadingBathStartTime = millis();
            currentScene = 'LOADING_BATH';
          }
        } else if (mouseX > dressX && mouseX < (dressX + dressW) && mouseY > cardY && mouseY < (cardY + cardH)) {
          if (!unlockedStages.dressUp) {
            lockTipMsg = "🔒 請先幫狗狗完成急救與洗澡喔！";
            lockTipTimer = millis() + 2200;
          } else {
            loadingDressStartTime = millis();
            currentScene = 'LOADING_DRESS';
          }
        }
      } 
      else if (currentScene === 'CARE_PLAYING') {
        if (px > 30 && px < 130 && py > 30 && py < 75) {
          currentScene = 'STAGE_SELECT';
          return;
        }

        if (careSuccess) {
          if (px > V_WIDTH / 2 - 210 && px < V_WIDTH / 2 - 10 && py > 490 && py < 545) {
            unlockedStages.bath = true;
            currentScene = 'STAGE_SELECT';
            return;
          }
        }

        let panelX = 645;
        let btnStartY = 85 + 50;
        let btnH = 92;
        for (let i = 0; i < careTools.length; i++) {
          let by = btnStartY + i * (btnH + 8);
          if (px > panelX + 10 && px < panelX + 125 && py > by && py < by + btnH) {
            selectedToolIndex = i;
            return;
          }
        }

        let dogExamX = V_WIDTH / 2 - 120;
        let dogExamY = 320;

        if (selectedToolIndex === 0 && !careTools[0].done) {
          let woundWorldX = dogExamX - 55;
          let woundWorldY = dogExamY + 12;
          if (dist(px, py, woundWorldX, woundWorldY) < 65) {
            isWiping = true;
            lastWipePos = { x: px, y: py };
          }
        }

        if (selectedToolIndex === 1 && !careTools[1].done) {
          let neckWorldX = dogExamX + 10;
          let neckWorldY = dogExamY - 25;
          if (dist(px, py, neckWorldX, neckWorldY) < 45) {
            isInjecting = true;
          } else if (dist(px, py, dogExamX, dogExamY) < 140) {
            lockTipMsg = "⚠️ 只能注射在狗狗脖子的皮下部位喔！";
            lockTipTimer = millis() + 1800;
          }
        }

        if (selectedToolIndex === 2 && !careTools[2].done) {
          for (let i = 0; i < bugs.length; i++) {
            let b = bugs[i];
            if (!b.inJar) {
              let bugWorldX = dogExamX + b.x;
              let bugWorldY = dogExamY + b.y;
              if (dist(px, py, bugWorldX, bugWorldY) < 28) {
                draggedBugIndex = i;
                b.caught = true;
                break;
              }
            }
          }
        }
      }
      else if (currentScene === 'BATH_PLAYING') {
        if (mouseX > 25 && mouseX < 135 && mouseY > 20 && mouseY < 65) {
          currentScene = 'STAGE_SELECT';
          return;
        }

        if (bathSuccess) {
          let btnW = max(220, 260 * (width / 1200));
          let btnH = max(45, 52 * (height / 800));
          let btnX = width * 0.42;
          let btnY = height * 0.88;
          if (mouseX > btnX - btnW / 2 && mouseX < btnX + btnW / 2 &&
              mouseY > btnY - btnH / 2 && mouseY < btnY + btnH / 2) {
            unlockedStages.dressUp = true;
            currentScene = 'STAGE_SELECT';
            return;
          }
        }

        if (!isColorConfirmed) {
          let panelW = min(600, width * 0.78);
          let panelH = max(135, 150 * (height / 800));
          let panelX = (width - panelW) / 2;
          let panelY = max(70, height * 0.12);
          let row1Y = panelY + panelH * 0.32;
          let startX = panelX + panelW * 0.44;
          let gap = (panelW * 0.50) / 6;

          for (let i = 0; i < TUB_COLORS.length; i++) {
            let cx = startX + i * gap;
            if (dist(mouseX, mouseY, cx, row1Y) < 20) {
              selectedTubColor = TUB_COLORS[i];
              return;
            }
          }

          let btnW = min(220, panelW * 0.44);
          let btnH = 40;
          let btnX = width / 2;
          let btnY = panelY + panelH * 0.74;
          if (mouseX > btnX - btnW / 2 && mouseX < btnX + btnW / 2 &&
              mouseY > btnY - btnH / 2 && mouseY < btnY + btnH / 2) {
            isColorConfirmed = true;
            triggerConfetti(1.0);
            return;
          }
        }

        if (isColorConfirmed && !bathDogState.inTub) {
          if (dist(mouseX, mouseY, bathDogState.x, bathDogState.y) < 100) {
            bathDogState.isDragging = true;
            return;
          }
        }

        let panelW = max(110, width * 0.12);
        let panelH = min(height * 0.65, 450);
        let panelX = width - panelW - max(20, width * 0.02);
        let panelY = height * 0.20;
        let btnStartY = panelY + 54;
        let btnH = (panelH - 74) / 3 - 10;

        if (bathDogState.inTub && bathCurrentStep === 1) {
          let by1 = btnStartY;
          if (mouseX > panelX + 8 && mouseX < panelX + panelW - 8 && mouseY > by1 && mouseY < by1 + btnH) {
            isShampooDragging = true;
            return;
          }
        }

        if (bathDogState.inTub && bathCurrentStep === 2) {
          let by2 = btnStartY + btnH + 10;
          let tubX = width * 0.42;
          let tubY = height * 0.63;
          if ((mouseX > panelX + 8 && mouseX < panelX + panelW - 8 && mouseY > by2 && mouseY < by2 + btnH) ||
              dist(mouseX, mouseY, tubX, tubY - height * 0.08) < 140) {
            isShowerActive = true;
          }
        }

        if (bathDogState.inTub && bathCurrentStep === 3) {
          let by3 = btnStartY + (btnH + 10) * 2;
          let tubX = width * 0.42;
          let tubY = height * 0.63;
          if ((mouseX > panelX + 8 && mouseX < panelX + panelW - 8 && mouseY > by3 && mouseY < by3 + btnH) ||
              dist(mouseX, mouseY, tubX, tubY - height * 0.08) < 140) {
            isDryerActive = true;
          }
        }
      }
      // 第三關更衣室互動點選
      else if (currentScene === 'DRESS_PLAYING') {
        if (mouseX > 25 && mouseX < 135 && mouseY > 20 && mouseY < 65) {
          currentScene = 'STAGE_SELECT';
          return;
        }

        if (dressGameOver) {
          let btnW = 240;
          let btnH = 50;
          let btnX = width / 2;
          let btnY = height * 0.86;
          if (mouseX > btnX - btnW / 2 && mouseX < btnX + btnW / 2 &&
              mouseY > btnY - btnH / 2 && mouseY < btnY + btnH / 2) {
            currentScene = 'STAGE_SELECT';
            return;
          }
        }

        let s = min(width / 950, height / 700);
        let wardX = width * 0.70;
        let wardY = height * 0.52;
        let wW = 340 * s;
        let wH = 390 * s;

        if (!wardrobeOpen) {
          if (mouseX > wardX - wW / 2 && mouseX < wardX + wW / 2 &&
              mouseY > wardY - wH / 2 && mouseY < wardY + wH / 2) {
            wardrobeOpen = true;
            return;
          }
        } else {
          // 1. 優先檢查衣櫃內 6 個格子的點選判定（精準使用縮放因子 s）
          let cols = 2;
          let itemW = 105 * s;
          let itemH = 68 * s;
          let startX = -65 * s;
          let startY = -95 * s;

          for (let i = 0; i < 6; i++) {
            let col = i % cols;
            let row = floor(i / cols);
            let ix = startX + col * (itemW + 18 * s);
            let iy = startY + row * (itemH + 12 * s);
            let worldX = wardX + ix;
            let worldY = wardY + iy;

            if (mouseX > worldX - itemW / 2 && mouseX < worldX + itemW / 2 &&
                mouseY > worldY - itemH / 2 && mouseY < worldY + itemH / 2) {
              if (dressPhase === 1) {
                selectedHatIndex = i;
                confirmedHat = -1; // 即時預覽選擇的帽子
              } else if (dressPhase === 2) {
                selectedSkinIndex = i;
                confirmedSkin = -1;
              } else if (dressPhase === 3) {
                selectedShoeIndex = i;
                confirmedShoe = -1;
              }
              return;
            }
          }

          // 2. 檢查 OK / 確定 按鈕
          let currentSelected = -1;
          if (dressPhase === 1) currentSelected = selectedHatIndex;
          else if (dressPhase === 2) currentSelected = selectedSkinIndex;
          else if (dressPhase === 3) currentSelected = selectedShoeIndex;

          if (currentSelected !== -1 && !dressGameOver) {
            let btnW = 150 * s;
            let btnH = 42 * s;
            let btnX = wardX;
            let btnY = wardY + wH / 2 - 38 * s;

            if (mouseX > btnX - btnW / 2 && mouseX < btnX + btnW / 2 &&
                mouseY > btnY - btnH / 2 && mouseY < btnY + btnH / 2) {
              if (dressPhase === 1) {
                confirmedHat = selectedHatIndex;
                wardrobeOpen = false;
                dressPhase = 4;
                dressGameOver = true;
                playHappySound();
                triggerConfetti(4.0);
              } else if (dressPhase === 3) {
                confirmedShoe = selectedShoeIndex;
                wardrobeOpen = false;
                dressPhase = 4;
                dressGameOver = true;
                playHappySound();
                triggerConfetti(4.0);
              }
              return;
            }
          }
        }
      }
    }

    function mouseDragged() {
      let vm = getVirtualMouse();

      if (currentScene === 'CARE_PLAYING') {
        let dogExamX = V_WIDTH / 2 - 120;
        let dogExamY = 320;

        if (selectedToolIndex === 0 && isWiping && !careTools[0].done) {
          let woundWorldX = dogExamX - 55;
          let woundWorldY = dogExamY + 12;

          if (dist(vm.x, vm.y, woundWorldX, woundWorldY) < 70) {
            let d = dist(vm.x, vm.y, lastWipePos.x, lastWipePos.y);
            if (d > 22) {
              cottonWipes++;
              lastWipePos = { x: vm.x, y: vm.y };
              painEffectTimer = millis() + 450;
              if (cottonWipes >= 5) {
                careTools[0].done = true;
                isWiping = false;
                checkAllDone();
              }
            }
          }
        }

        if (selectedToolIndex === 2 && draggedBugIndex !== -1) {
          let b = bugs[draggedBugIndex];
          b.x = vm.x - dogExamX;
          b.y = vm.y - dogExamY;
        }
      } else if (currentScene === 'BATH_PLAYING') {
        let tubX = width * 0.42;
        let tubY = height * 0.63;

        if (bathDogState.isDragging && !bathDogState.inTub) {
          bathDogState.x = mouseX;
          bathDogState.y = mouseY;
          if (dist(mouseX, mouseY, tubX, tubY) < 140) {
            bathDogState.inTub = true;
            bathDogState.isDragging = false;
          }
        }

        if (isShampooDragging && bathCurrentStep === 1) {
          if (dist(mouseX, mouseY, tubX, tubY - height * 0.08) < 95) {
            bathDogState.headBubbles = min(100, bathDogState.headBubbles + 2.5);
            bathDogState.bodyBubbles = min(100, bathDogState.bodyBubbles + 1.8);

            if (bathDogState.headBubbles >= 100) {
              isShampooDragging = false;
              bathCurrentStep = 2;
              triggerConfetti(1.2);
            }
          }
        }

        if (bathDogState.inTub && bathCurrentStep === 2 && isShowerActive) {
          bathDogState.washProgress = min(100, bathDogState.washProgress + 1.6);
          bathDogState.headBubbles = max(0, 100 - bathDogState.washProgress);
          bathDogState.bodyBubbles = max(0, 100 - bathDogState.washProgress);

          if (bathDogState.washProgress >= 100) {
            bathDogState.stage = 2;
            isShowerActive = false;
            bathCurrentStep = 3;
          }
        }

        if (bathDogState.inTub && bathCurrentStep === 3 && isDryerActive) {
          bathDogState.dryProgress = min(100, bathDogState.dryProgress + 1.4);
          if (bathDogState.dryProgress >= 100) {
            bathDogState.stage = 3;
            isDryerActive = false;
            bathSuccess = true;
            triggerConfetti(4.0);
          }
        }
      }
    }

    function mouseWheel(event) {
      if (currentScene === 'CARE_PLAYING' && selectedToolIndex === 3 && !careTools[3].done) {
        let vm = getVirtualMouse();
        let dogExamX = V_WIDTH / 2 - 120;
        let dogExamY = 320;

        if (dist(vm.x, vm.y, dogExamX - 45, dogExamY + 12) < 130) {
          if (event.delta > 0) {
            bandageRollProgress = min(100, bandageRollProgress + 8);
            painEffectTimer = millis() + 350;

            if (bandageRollProgress >= 100) {
              careTools[3].done = true;
              checkAllDone();
            }
          }
        }
        return false;
      }
    }

    function checkAllDone() {
      let all = careTools.every(t => t.done);
      if (all) {
        careSuccess = true;
        unlockedStages.bath = true;
      } else {
        let nextIdx = careTools.findIndex(t => !t.done);
        if (nextIdx !== -1) selectedToolIndex = nextIdx;
      }
    }

    function mousePressed() {
      playLampSound();
      let vm = getVirtualMouse();
      handlePointerDown(vm.x, vm.y);
    }

    function touchStarted() {
      playLampSound();
      let vm = getVirtualMouse();
      handlePointerDown(vm.x, vm.y);
      return false;
    }

    function mouseReleased() {
      if (branchData.isDragging) {
        branchData.isDragging = false;
        if (!branchData.isRemoved) {
          branchData.x = branchData.initialX;
          branchData.y = branchData.initialY;
        }
      }

      isWiping = false;
      isInjecting = false;

      if (currentScene === 'BATH_PLAYING') {
        if (bathDogState.isDragging && !bathDogState.inTub) {
          bathDogState.x = width * 0.76;
          bathDogState.y = height * 0.60;
          bathDogState.isDragging = false;
        }
        isShampooDragging = false;
        isShowerActive = false;
        isDryerActive = false;
      }

      if (draggedBugIndex !== -1) {
        let vm = getVirtualMouse();
        let b = bugs[draggedBugIndex];

        if (vm.x > jarBounds.x && vm.x < jarBounds.x + jarBounds.w &&
            vm.y > jarBounds.y && vm.y < jarBounds.y + jarBounds.h) {
          b.inJar = true;
          painEffectTimer = millis() + 500;
        } else {
          b.caught = false;
        }
        draggedBugIndex = -1;

        let allBugsInJar = bugs.every(bug => bug.inJar);
        if (allBugsInJar) {
          careTools[2].done = true;
          checkAllDone();
        }
      }
    }

    function touchEnded() {
      mouseReleased();
      return false;
    }
  </script>
</body>
